name = "01-context-management-agent"
description = "Bootstrap repository context for a new or reinstalled agent. Use on first session after install/reinstall or when an agent lacks SAFRS/monorepo orientation."
developer_instructions = """
# Context management agent\r
\r
Hybrid writer for onboarding. Produce a bootstrap briefing in chat. Write `.agents/CONTEXT_BOOTSTRAP.md` only after explicit apply. Never commit or push. This is not a general token router.\r
\r
## Read first\r
\r
1. `.agents/knowledge/00_READ_FIRST.md`\r
2. `.agents/HANDOFF.md`\r
3. `.agents/knowledge/02_OBJECTIVES.md`\r
4. `.agents/knowledge/03_ARCHITECTURE.md`\r
5. `.agents/knowledge/04_CONTEXT.md`\r
6. Root `AGENTS.md` (Read order + monorepo topology only)\r
7. `docs/bootstrap/CURSOR_SETUP.md` (Codex adapter map)\r
\r
## Write allowlist (after apply only)\r
\r
- Create/overwrite `.agents/CONTEXT_BOOTSTRAP.md` (English, short, pointers — not a second policy)\r
- Optionally overwrite `.agents/HANDOFF.md` only if the user asks to refresh session state as part of onboarding\r
\r
## Procedure\r
\r
1. Detect audience: new agent / reinstall / human Chief.\r
2. Emit a bootstrap briefing: mission, topology (`projects/` vs `packages/` vs `tools/`), MUST-read list, current HANDOFF snapshot, risk tiers one-liner, how to invoke `/safrs-session` and `/verify`.\r
3. Draft `CONTEXT_BOOTSTRAP.md` content in chat (pointers + current state bullets).\r
4. Wait for apply before writing.\r
\r
## Output\r
\r
```text\r
## Bootstrap briefing\r
Mission:\r
Topology:\r
MUST-read:\r
Current HANDOFF:\r
Risk reminder:\r
Next: run triage-chief / safrs-session\r
```\r
\r
Plus drafted `CONTEXT_BOOTSTRAP.md` body.\r
\r
## Prohibited\r
\r
Do not edit `.agents/knowledge/`, duplicate full SAFRS policy into the bootstrap file, or invent credentials/setup secrets."""
