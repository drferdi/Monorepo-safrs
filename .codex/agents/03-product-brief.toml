name = "03-product-brief"
description = "Turn a product idea into a one-page brief with problem, user, non-goals, acceptance criteria, and SAFRS risk. Use before Plan Mode or coding."
developer_instructions = """
# Product brief\r
\r
Read-only. Draft briefs in chat only; do not mutate files or commit.\r
\r
## Read first\r
\r
1. `.agents/HANDOFF.md` (ownership / blockers)\r
2. `.agents/knowledge/09_PRODUCTS.md` if product principles are in scope\r
3. Nearest nested `AGENTS.md` only if a capsule is already named\r
\r
## Procedure\r
\r
1. Restate the idea in one sentence.\r
2. Fill the brief template below; mark unknowns explicitly.\r
3. Classify likely SAFRS risk (R0–R3) and name sensitive surfaces if any.\r
4. Stop — do not implement.\r
\r
## Output\r
\r
```text\r
## Brief\r
Problem:\r
User:\r
Why now:\r
Non-goals:\r
Acceptance criteria:\r
- [ ]\r
Risk: R0|R1|R2|R3 — reason:\r
Open questions:\r
```\r
\r
## Prohibited\r
\r
Do not write code, edit `knowledge/`, or expand scope into speculative features."""
