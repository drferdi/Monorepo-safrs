services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentrabot_test}
      POSTGRES_USER: sentrabot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sentrabot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentrabot -d ${POSTGRES_DB:-sentrabot_test}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  web:
    build:
      context: ../../../../
      dockerfile: projects/product/sentrabot/infra/compose/Dockerfile.web
    environment:
      DATABASE_URL: postgresql://sentrabot:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentrabot_test}
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
    depends_on:
      postgres: { condition: service_healthy }
      worker: { condition: service_healthy }
    ports: ["3000:3000"]
    networks: [backend, public]

  worker:
    build:
      context: ../../../../
      dockerfile: projects/product/sentrabot/infra/compose/Dockerfile.worker
    environment:
      NODE_ENV: production
      WORKER_CONTROL_TOKEN: ${WORKER_CONTROL_TOKEN:?WORKER_CONTROL_TOKEN is required}
    expose: ["8787"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  supervisor:
    build:
      context: ../../../../
      dockerfile: projects/product/sentrabot/infra/compose/Dockerfile.supervisor
    environment:
      NODE_ENV: production
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN is required}
    expose: ["8788"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

volumes:
  sentrabot-postgres:

networks:
  backend:
    internal: true
  public:
