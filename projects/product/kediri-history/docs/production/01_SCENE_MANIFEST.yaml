- scene_id: '01'
  act: ACT I
  year_or_marker: '879'
  title: The First Mark
  image_file: project-images/01 — 879 — The First Mark.png
  source_filename: 01 — 879 — The First Mark.png
  source_dimensions: 1536x1024
  image_verified: true
  hero_subject: A large inscribed stone block in raking light, filling most of the
    frame, with a dark temple interior falling away behind it.
  evidence_class: V4_artistic_interpretation
  evidence_class_note: Composed as an authenticated artefact in situ. High Rule 2
    risk - a visitor may read it as a photograph of a surviving inscription.
  baked_text_audit: PRESENT. Three lines of decorative pseudo-script, plus a fourth
    line reading "27 [pseudo-glyph] 879". Verified at 4x zoom - the middle glyph is
    an invented character standing in for "Juli", not the numeral 1. Earlier reading
    of "1879" was wrong and is corrected here.
  canon_conflict: 08_MASTER_PRODUCTION_NARRATIVE Scene 01 states the record was
    written on metal ("dituliskan pada logam"). The asset shows stone.
  baked_text_box: (370,645)-(1240,765), measured from a coordinate grid over the
    source asset.
  crop_desktop: Source window x=0 y=0 w=1536 h=620 - the upper band of the stone
    face. Verified to keep the date line outside the visible rect at 1280x720,
    1366x768, 1440x900, 1680x1050, 1920x1080, 2560x1080, and 3440x1440.
  crop_mobile: Source window x=0 y=0 w=1500 h=620. Verified at 360x780, 390x844,
    412x915, 414x896, and 430x932.
  object_position_desktop: 50% 50%
  object_position_mobile: 50% 50%
  visual_notes: Crop is damage limitation, not a fix. The chronological text is
    removed from frame by the desktop crop; the pseudo-script cannot be cropped out
    without destroying the subject. Year and date must be DOM regardless. See
    REDO-ASSET-001.
  camera_intention: DEFINED_IN_SCENE_CONTRACT
  light_behavior: DEFINED_IN_SCENE_CONTRACT
  historical_argument: DEFINED_IN_PRODUCTION_NARRATIVE
  transition_in: SEE_03_TRANSITION_MAP
  transition_out: SEE_03_TRANSITION_MAP
