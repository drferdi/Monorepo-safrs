version: 2.1.0
image_count: 27
finale_reuses_scene: '00'
canonical_source_directory: project-images/
mapping_policy: Inspect actual assets. Never infer by alphabetical order alone. Do
  not invent filenames.
source_authority_note: project-images/ is the authoritative production image
  directory per Chief decision 2026-08-28. apps/web/editorial-preview/journey/
  contains webp derivatives of these same files and is NOT an independent source.
  Verified perceptually - mean absolute pixel difference between each PNG and its
  webp derivative is 3.1-4.0 at 768x512, i.e. compression noise only, not different
  imagery.
evidence_class_values: Follows the public media taxonomy implemented in
  apps/web/src/components/journey/scene-media.tsx - V0_primary_object,
  V1_documentary_historical_image, V2_verified_contemporary_documentation,
  V3_evidence_constrained_reconstruction, V4_artistic_interpretation,
  V5_folklore_visualization. Assigned from each asset's real provenance. The entire
  set is generated imagery, so no asset qualifies as V0, V1, or V2.
status_values:
- UNMAPPED
- MAPPED_READY_FOR_REVIEW
- MAPPED_WITH_FLAG
- APPROVED
crop_verification: Batch A crop windows are enforced by
  apps/web/tests/framing-baked-text.test.ts, which replays the browser's own
  object-fit cover plus transform maths across every supported desktop and mobile
  viewport and fails if any recorded baked-text box re-enters the visible rect.
  Implementation lives in apps/web/src/modules/motion/framing.ts. Source assets are
  never modified.
baked_text_audit_policy: Records literal text burned into each raster. Under
  Authority Rule 1 such text must live in the DOM when it carries factual,
  chronological, geographical, evidentiary, or epistemic meaning. Recorded here so
  the defect is visible and directable, per Chief instruction not to reopen image
  production. See ASSET EPISTEMIC INTEGRITY in 05_REDO_REGISTER.md.
