    (x~700..1030, y~735..800).
  canon_conflict: Canon 08 spells Janggala. The asset spells JENGGALA. All labels are
    English inside an Indonesian-language production.
  baked_text_boxes: PANJALU (160,370)-(410,600); JENGGALA (1120,370)-(1395,600);
