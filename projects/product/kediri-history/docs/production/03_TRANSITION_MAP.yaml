# 03 — TRANSITION MAP
## Every handoff must define outgoing element → transformation → incoming element.

transitions:
  - from: "00 — 2026"
    to: "01 — 879"
    outgoing: "Brantas / modern reflection"
    transformation: "reflection loses modern detail; water/material becomes darker, denser, metallic"
    incoming: "record / inscription world"
    argument: "The living city is connected to an older recorded past."

  - from: "01 — 879"
    to: "02 — 921"
    outgoing: "inscription groove / written mark"
    transformation: "engraved line becomes a written identity"
    incoming: "KADHIRI"
    argument: "A record becomes a name."

  - from: "02 — 921"
    to: "03 — 1015"
    outgoing: "KADHIRI"
    transformation: "the name persists while time and surrounding world change"
    incoming: "continuity / research hold"
    argument: "The name endures."

  - from: "03 — 1015"
    to: "04 — 1042"
    outgoing: "written line"
    transformation: "line expands into geography; Brantas becomes dominant"
    incoming: "political field / division"
    argument: "Recorded identity becomes political geography."

  - from: "04 — 1042"
    to: "05 — Daha"
    outgoing: "divided territory"
    transformation: "one side gains visual gravity"
    incoming: "center of power"
    argument: "Division produces a new political center."

  - from: "05 — Daha"
