# Infrastruktur pengembangan lokal milik capsule.
#
# Sepenuhnya capsule-owned: nama proyek, volume, dan port terpisah dari
# Postgres Monorepo (127.0.0.1:54329) supaya keduanya bisa hidup bersamaan di
# mesin Chief. Tidak ada satu pun bagian file ini yang menjadi dependensi
# Monorepo, dan sebaliknya.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down
#
# Kredensial di sini adalah nilai pengembangan lokal, bukan rahasia produksi.

name: kediri-history

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kediri
      POSTGRES_PASSWORD: kediri
      POSTGRES_DB: kediri_history_dev
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kediri -d kediri_history_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      # Postgres 18 menyimpan data di subdirektori per-versi mayor
      # (/var/lib/postgresql/18/docker). Mount harus berada di INDUKNYA;
      # memasang tepat di .../data membuat image menolak start. Ini bukan
      # preferensi gaya - image 18+ gagal keras kalau salah.
      - postgres_data:/var/lib/postgresql

  # Object storage S3-compatible. Pemisahan publik/privat adalah aturan
  # arsitektur, bukan konvensi penamaan: bucket privat memuat master arsip dan
  # dokumen hak, dan tidak pernah dilayani ke browser.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: kediri
      MINIO_ROOT_PASSWORD: kediri-local-dev
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9011"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - minio_data:/data

  # Membuat kedua bucket dan menetapkan kebijakannya sekali, lalu berhenti.
  # Bucket publik dapat dibaca anonim (hanya derivatif yang bersih hak);
  # bucket privat tetap tertutup.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set kediri http://minio:9000 kediri kediri-local-dev &&
      mc mb --ignore-existing kediri/kediri-public &&
      mc mb --ignore-existing kediri/kediri-private &&
      mc anonymous set download kediri/kediri-public &&
      mc anonymous set none kediri/kediri-private &&
      echo 'buckets siap: kediri-public (download), kediri-private (none)'
      "

volumes:
  postgres_data:
  minio_data:
