name: Production Motion Canary

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KEDIRI_MOTION_CANARY_URL: https://kediri.sentrahai.com
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify deployed motion runtime
        run: pnpm --filter @kediri/web e2e:production:built

      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: ignore
          name: production-motion-canary
          path: |
            apps/web/playwright-report
            apps/web/test-results
