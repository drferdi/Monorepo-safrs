packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true

# Minutes (pnpm unit): 1440 = 1 day. A quoted duration string crashes pnpm
# with "Invalid time value" during install and implicit deps checks.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - resend@6.19.0
  - stripe@22.5.0

# Force transitive copies onto patched releases (Dependabot GHSA remediation).
overrides:
  postcss: 8.5.26
  sharp: ">=0.35.1"
  # GHSA-ggr8-5vv4-36mx / CVE-2026-40345: uncontrolled recursion in
  # deepmerge-ts < 8.0.0, pulled in transitively by @prisma/config.
  deepmerge-ts: ">=8.0.1"
