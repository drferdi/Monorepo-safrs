packages:
  - apps/*

allowBuilds:
  esbuild: true
  sharp: true

# Verifier standalone (tools/project-standalone) menolak symlink/reparse point
# di seluruh pohon capsule, termasuk node_modules hasil install. Linker hoisted
# menghasilkan node_modules datar tanpa symlink; @sentra/token dikonsumsi
# sebagai tarball vendor/ (bukan workspace link) untuk alasan yang sama.
nodeLinker: hoisted

# Advisori keamanan (pnpm audit 2026-09-25): next < 16.3.3 RCE (juga lewat peer
# opsional @sentra/token dari vendor/), sharp < 0.35.4 libheif.
overrides:
  next: 16.3.6
  sharp: ">=0.35.4"
