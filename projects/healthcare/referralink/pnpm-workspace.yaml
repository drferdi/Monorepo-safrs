# Capsule standalone: workspace pnpm milik referralink sendiri, lockfile di folder ini.
packages: []

# Kontrak standalone menolak symlink di pohon capsule; linker hoisted membuat
# node_modules datar tanpa symlink.
nodeLinker: hoisted

# pnpm 11 wajib keputusan eksplisit. esbuild dibutuhkan Vite; postinstall Carbon
# dan IBM Plex (telemetri/font) serta @parcel/watcher (biner prebuilt) tidak.
allowBuilds:
  esbuild: true
  '@carbon/colors': false
  '@carbon/feature-flags': false
  '@carbon/grid': false
  '@carbon/icon-helpers': false
  '@carbon/icons-react': false
  '@carbon/layout': false
  '@carbon/motion': false
  '@carbon/react': false
  '@carbon/styles': false
  '@carbon/themes': false
  '@carbon/type': false
  '@carbon/utilities': false
  '@ibm/plex': false
  '@ibm/plex-mono': false
  '@ibm/plex-sans': false
  '@ibm/plex-sans-arabic': false
  '@ibm/plex-sans-devanagari': false
  '@ibm/plex-sans-hebrew': false
  '@ibm/plex-sans-thai': false
  '@ibm/plex-sans-thai-looped': false
  '@ibm/plex-serif': false
  '@parcel/watcher': false

minimumReleaseAgeExclude:
  - '@vercel/build-utils@14.13.1'
  - '@vercel/node@16.0.1'

# Advisori keamanan (pnpm audit 2026-09-26): @vercel/node 16.0.1 (dipakai hanya
# untuk tipe VercelRequest/VercelResponse) masih membawa undici, path-to-regexp,
# dan ajv versi rentan.
overrides:
  '@vercel/node>undici': ^6.28.0
  '@vercel/node>path-to-regexp': ^6.3.0
  '@vercel/static-config>ajv': ^8.18.0
