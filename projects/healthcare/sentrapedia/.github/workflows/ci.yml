# Capsule CI (tech-debt row 16). It runs in the standalone drferdi/Sentrapedia repository;
# the monorepo CI does not touch projects/ by design. No step calls a paid model or needs a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # LFS holds the TheOracle vectors that the grounding tests read, the site PNGs and the video and WebP media.
      # Objects come from a cache keyed on the LFS file list; on a miss the nearest older cache is restored,
      # so a run downloads only what changed. A file still a pointer after the pull fails the run.
      - uses: actions/checkout@v7
        with:
          lfs: false
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - run: '! git lfs ls-files | grep -q " - "'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Matches python3 in the Dockerfile's bookworm image; postinstall builds the MIRA venv with it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # postinstall downloads the pinned 1.2 GB embedding model and skips files whose hash already matches.
      - uses: actions/cache@v6
        with:
          path: theoracle/model
          key: theoracle-model-${{ hashFiles('scripts/theoracle-model.mjs') }}
      - run: npm ci
      # Runtime dependencies only; .npmrc keeps audit=false so local installs stay quiet.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      # The ruff version is pinned because its default rules change between releases (mira/ruff.toml).
      - run: pipx run ruff==0.17.1 check mira
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run site:verify
      - run: npm run site:docs
      - run: npm run build
      - run: npm run deploy:dry-run
  # Builds the image only: the launcher's provider preflight needs a real GEMINI_API_KEY, which CI never holds.
  docker:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - run: '! git lfs ls-files | grep -q " - "'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
