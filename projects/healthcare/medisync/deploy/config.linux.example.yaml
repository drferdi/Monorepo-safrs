auxiliary:
  free_only: false
gateway:
  platforms:
    whatsapp:
      enabled: true
      extra:
        group_allowed_chats:
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
        free_response_chats:
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
          - "<jid-grup-kerja>@g.us"
        text_batch_delay_seconds: 5
        text_batch_split_delay_seconds: 10
_config_version: 37
platforms:
  whatsapp:
    enabled: true
    home_channel:
      platform: "whatsapp"
      chat_id: "<lid-chief>@lid"
      name: "<nama-chief>"
      user_id: "<lid-chief>@lid"
onboarding:
  seen:
    busy_input_prompt: true
