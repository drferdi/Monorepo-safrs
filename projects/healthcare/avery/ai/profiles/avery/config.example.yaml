# Avery — contoh konfigurasi profil (kapsul projects/healthcare/avery)
#
# Salin berkas ini ke <HERMES_HOME>/profiles/avery/config.yaml lalu sesuaikan
# path dan nilai yang bertanda <...>. Rahasia (API key, token, kredensial)
# TIDAK pernah ditulis di sini — tempatnya di .env, lihat deploy/.env.example.
#
# Bentuk berkas ini mencerminkan konfigurasi produksi per 2026-08-23. Riwayat
# perbaikan dan alasan tiap keputusan ada di docs/whatsapp-group-fix.md.

model:
  default: openai/gpt-5.6-luna
  provider: openrouter

# Sementara (2026-08-27): Luna lebih murah dari Gemini 2.5 Flash di OpenRouter.
# Flash tetap fallback. Kembalikan default ke Flash bila kualitas Luna tidak cukup.
#
# SKU ":free" di OpenRouter berbagi kuota antar seluruh pengguna dan sering
# menolak dengan 429. Untuk agen yang melayani percakapan sungguhan, pakai
# model berbayar.

fallback_providers:
  - provider: openrouter
    model: google/gemini-2.5-flash

auxiliary:
  # true membatasi fallback tugas auxiliary (ringkasan, judul sesi) ke model
  # gratis. Hemat, tetapi bila seluruh SKU gratis sedang 429 tugas auxiliary
  # gagal diam-diam. Produksi memakai false karena keandalan lebih penting.
  free_only: false

display:
  compact: true
  memory_notifications: 'on'
  # WhatsApp: jangan kirim "Reading skill …" / jejak tool ke chat.
  tool_progress: off

memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: true
  memory_char_limit: 2200
  # Dinaikkan dari default 1375 karena profil pengguna Sentra memuat
  # protokol komunikasi yang panjang. Batas lama membuat penulisan memori
  # gagal dengan galat konsolidasi.
  user_char_limit: 2200

skills:
  guard_agent_created: true
  write_approval: true

discord:
  require_mention: true
  auto_thread: true
  reactions: true

# PENTING — presedens konfigurasi WhatsApp.
#
# Blok `whatsapp:` tingkat atas ini MENIMPA `gateway.platforms.whatsapp.extra`
# untuk semua kunci bridgeable (gateway/config.py menjalankan
# `extra.update(bridged)`). Menaruh nilai di `extra` sementara kunci yang sama
# ada di sini menghasilkan kegagalan senyap.
#
# Dua kunci TIDAK bridgeable dan hanya berlaku bila ditulis di `extra`:
#   - group_allowed_chats  (hanya di-bridge untuk Telegram)
#   - free_response_chats  (yang di-bridge bernama free_response_channels)
whatsapp:
  unauthorized_dm_behavior: ignore
  # Matikan notifikasi "Gateway shutting down / restarting / back online" yang
  # dikirim ke chat WhatsApp. Dipatuhi oleh lima jalur notice di gateway.
  gateway_restart_notification: false

  # true  → di grup, agen hanya *menjawab* bila dipanggil. Pesan allowlist
  #         tanpa sebut nama tetap dicatat (OBSERVED_SILENT), tidak memanggil model.
  # false → menanggapi setiap pesan di setiap grup yang lolos group_policy.
  # Jangan isi extra.free_response_chats untuk grup kerja: itu memaksa giliran
  # model penuh tiap obrolan. Baca tanpa balas = require_mention + observe.
  require_mention: true

  # Regex WAJIB ditulis dalam kutip tunggal YAML. Dalam kutip ganda, penulis
  # otomatis meng-escape backslash menjadi ganda sehingga "\b" berubah jadi
  # backslash literal dan pola tidak pernah cocok dengan apa pun.
  mention_patterns:
    - '(?i)\b<nama-agen>\b'

  # allowlist → hanya grup di group_allow_from; grup lain diam total tanpa log.
  # disabled  → tidak ada grup yang diproses.
  # pairing   → menolak semua grup (pairing hanya berlaku untuk DM).
  # open      → semua grup diproses, TETAPI sejak Hermes 0.20.4 gateway menolak
  #             start bila nilainya `open` tanpa WHATSAPP_ALLOW_ALL_USERS, dan
  #             flag itu membuat `_is_user_authorized` mengembalikan True untuk
  #             siapa pun — di grup maupun DM. Praktis tidak bisa dipakai bila
  #             allowlist pengirim masih ingin dipertahankan.
  #
  # Nilai selain keempat itu — termasuk "none" — jatuh ke tolak-semua secara
  # senyap. Itu penyebab bug grup-diam yang didokumentasikan di docs/.
  #
  # Karena `open` tertutup, grup baru harus didaftarkan manual. Jalankan
  # scripts/check-unregistered-groups.ps1 untuk menemukan yang terlewat.
  group_policy: allowlist

  # Grup yang lolos gerbang intake. Wajib sinkron dengan group_allowed_chats
  # di `extra` — mengisi salah satu saja membuat pesan lolos satu lapisan lalu
  # dibuang di lapisan berikutnya.
  group_allow_from:
    - <jid-grup-kerja>@g.us

  send_read_receipts: false

platforms:
  whatsapp:
    enabled: true
    home_channel:
      platform: whatsapp
      chat_id: <nomor-atau-lid>@lid
      name: <nama-tampilan>
      user_id: <nomor-atau-lid>@lid

gateway:
  platforms:
    whatsapp:
      enabled: true
      extra:
        # Mengotorisasi SELURUH anggota grup terdaftar, tanpa memandang nomor.
        # Ini kontrol per grup, bukan per orang: siapa pun yang ditambahkan ke
        # grup ini langsung punya akses penuh ke agen. Kosongkan bila hanya
        # nomor di WHATSAPP_ALLOWED_USERS yang boleh memakai agen.
        group_allowed_chats:
          - <jid-grup-kerja>@g.us

        # Grup yang boleh berpercakapan tanpa menyebut nama agen sama sekali.
        # Diperiksa sebelum gerbang mention. Tidak mendukung wildcard — tiap
        # JID harus ditulis eksplisit.
        free_response_chats:
          - <jid-grup-kerja>@g.us

        # Menunda pemrosesan beberapa detik agar pesan beruntun digabung jadi
        # satu pemanggilan agen. Efeknya balasan grup terasa tertunda ~5 detik.
        text_batch_delay_seconds: 5
        text_batch_split_delay_seconds: 10

# MCP server bawaan Hermes Studio. Path di bawah ini khas mesin Windows tempat
# Studio terpasang; di server Linux sesuaikan atau hapus blok ini seluruhnya.
mcp_servers:
  hermes-studio-api:
    command: <path-ke-node>/node.exe
    args:
      - <path-ke-hermes-studio>/resources/webui/bin/hermes-studio-mcp.mjs
      - api
    env:
      HERMES_WEB_UI_URL: http://127.0.0.1:8748
      HERMES_WEB_UI_HOME: <path-ke-hermes-web-ui>
      HERMES_WEBUI_STATE_DIR: <path-ke-hermes-web-ui>
      HERMES_WEB_UI_PROFILE: avery
      HERMES_MCP_SERVER_NAME: hermes-studio-api
      HERMES_MCP_TOOLSET: api
      HERMES_WEB_UI_MANAGED_MCP: '1'
    enabled: true
  # Toolset lain mengikuti pola yang sama, hanya berbeda pada argumen terakhir
  # dan HERMES_MCP_TOOLSET: browser, devices, use.
