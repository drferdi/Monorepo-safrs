packages:
  - projects/*/apps/*
  - packages/*
  - tools/*

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true

catalog:
  "@biomejs/biome": 2.5.7
  "@faker-js/faker": 10.5.0
  "@hono/zod-validator": 0.9.0
  "@hookform/resolvers": 5.0.1
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/exporter-trace-otlp-http": 0.221.0
  "@opentelemetry/instrumentation-http": 0.221.0
  "@opentelemetry/resources": 2.10.0
  "@opentelemetry/sdk-node": 0.221.0
  "@opentelemetry/semantic-conventions": 1.30.0
  "@playwright/test": 1.62.1
  "@prisma/adapter-pg": 7.9.1
  "@prisma/client": 7.9.1
  "@prisma/instrumentation": 7.9.1
  "@radix-ui/react-dropdown-menu": 2.1.12
  "@radix-ui/react-label": 2.1.4
  "@radix-ui/react-slot": 1.2.0
  "@react-email/components": 1.0.12
  "@react-email/ui": 6.9.2
  "@t3-oss/env-core": 0.13.8
  "@t3-oss/env-nextjs": 0.13.8
  "@tailwindcss/postcss": 4.3.3
  "@tanstack/react-query": 5.56.2
  "@types/node": 24.10.13
  "@types/pg": 8.15.6
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  "@vitest/coverage-v8": 4.1.10
  axios: 1.18.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dayjs: 1.11.13
  fast-check: 4.9.0
  hono: 4.13.1
  husky: 9.1.7
  lucide-react: 0.516.0
  next: 16.3.0
  pg: 8.16.3
  playwright: 1.62.1
  postcss: 8.5.26
  prisma: 7.9.1
  react: 19.2.8
  react-dom: 19.2.8
  react-email: 6.9.2
  react-hook-form: 7.56.2
  resend: 6.19.0
  stripe: 22.5.0
  tailwind-merge: 3.2.0
  tailwindcss: 4.3.3
  turbo: 2.10.9
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3

# Minutes (pnpm unit): 1440 = 1 day. A quoted duration string crashes pnpm
# with "Invalid time value" during install and implicit deps checks.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - resend@6.19.0
  - stripe@22.5.0

# Force transitive copies onto patched releases (Dependabot GHSA remediation).
overrides:
  postcss: "catalog:"
  sharp: ">=0.35.1"
  # GHSA-ggr8-5vv4-36mx / CVE-2026-40345: uncontrolled recursion in
  # deepmerge-ts < 8.0.0, pulled in transitively by @prisma/config.
  deepmerge-ts: ">=8.0.1"
