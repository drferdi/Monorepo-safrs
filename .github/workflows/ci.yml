name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://safrs:safrs@127.0.0.1:54329/safrs_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable test database
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pgBin = "C:\Program Files\PostgreSQL\17\bin"
          $env:Path = "$pgBin;$env:Path"
          $pgConfig = "C:\PostgreSQL\17\data\postgresql.conf"
          $pgConfigText = Get-Content -LiteralPath $pgConfig -Raw
          if ($pgConfigText -match "(?m)^\s*#?\s*port\s*=") {
            $pgConfigText = [regex]::Replace($pgConfigText, "(?m)^\s*#?\s*port\s*=.*$", "port = 54329")
          } else {
            $pgConfigText = "$pgConfigText`r`nport = 54329`r`n"
          }
          Set-Content -LiteralPath $pgConfig -Value $pgConfigText -NoNewline
          Set-Service -Name "postgresql-x64-17" -StartupType Manual
          Start-Service -Name "postgresql-x64-17"
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            & pg_isready --host 127.0.0.1 --port 54329 --username postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            throw "PostgreSQL Windows service did not become ready."
          }
          $env:PGPASSWORD = "root"
          & psql --host 127.0.0.1 --port 54329 --username postgres --dbname postgres --command "CREATE ROLE safrs LOGIN CREATEDB PASSWORD 'safrs';"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create disposable PostgreSQL role."
          }
          & createdb --host 127.0.0.1 --port 54329 --username postgres --owner safrs safrs_test
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create disposable PostgreSQL database."
          }
          Remove-Item Env:PGPASSWORD
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
      - name: Install browser engine
        run: pnpm exec playwright install chromium
      - name: Verify SAFRS governance
        run: pnpm governance
        env:
          SAFRS_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          SAFRS_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify automation policy
        run: node --test tests/repository/automation-policy.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test contracts and runtime
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser smoke
        run: pnpm test:e2e
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: ignore
          name: playwright-results
          path: |
            projects/golden-path/apps/web/playwright-report
            projects/golden-path/apps/web/test-results
