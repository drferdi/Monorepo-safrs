name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://safrs:safrs@127.0.0.1:54329/safrs_test
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: safrs_test
          POSTGRES_PASSWORD: safrs
          POSTGRES_USER: safrs
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U safrs -d safrs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          lfs: true
          # check_sensitive_changes.py resolves origin/main for its local
          # diff fallback; a shallow clone makes classification unavailable.
          fetch-depth: 0
          # No later step performs authenticated git operations.
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.21.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare disposable test database
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
      - name: Install browser engine
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify SAFRS governance
        run: pnpm governance
      - name: Verify automation policy
        run: node --test tests/repository/automation-policy.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test contracts and runtime
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Browser smoke
        run: pnpm test:e2e
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: ignore
          name: playwright-results
          path: |
            projects/golden-path/apps/web/playwright-report
            projects/golden-path/apps/web/test-results
