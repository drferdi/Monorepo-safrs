name: SAFRS Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, immutable SHA
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine diff base
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "SAFRS_BASE_REF=${{ github.event.pull_request.base.sha }}"
          Add-Content -Path $env:GITHUB_ENV -Value "SAFRS_HEAD_REF=${{ github.event.pull_request.head.sha }}"

      - name: Validate SAFRS policy
        run: python tools/safrs/check_policy.py

      - name: Validate document registry
        run: python tools/safrs/check_docs.py

      - name: Validate agent routing
        run: python tools/safrs/check_routing.py

      - name: Validate tool and network inventory
        run: python tools/safrs/check_tool_inventory.py

      - name: Validate monorepo topology and project capsules
        run: python tools/safrs/check_topology.py

      - name: Enforce immutable GitHub Action pins
        run: python tools/safrs/check_actions_pinning.py

      - name: Validate active task ownership
        run: python tools/safrs/check_task_ownership.py

      - name: Test task ownership invariants
        run: python tests/governance/test_task_ownership.py

      - name: Classify sensitive and verification-control changes
        run: python tools/safrs/check_sensitive_changes.py

      - name: Test architecture invariants
        run: python tests/architecture/test_safrs_topology.py

      - name: Test risk classification invariants
        run: python tests/governance/test_sensitive_classification.py
